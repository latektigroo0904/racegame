name: Land aero patch 41

on:
  push:
    paths:
      - ".github/workflows/land-aero41.yml"

permissions:
  contents: write

jobs:
  land-aero41:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Apply and verify fail-closed aero closure
        shell: bash
        run: |
          set -euo pipefail
          python scripts/apply_aero_asset_closure.py
          python scripts/verify_aero_asset_closure.py
          git diff --check

          mapfile -t changed < <(git diff --name-only)
          expected=(
            "Plugins/TorqueVehicleSimulation/Source/TA_Vehicle/Private/TAVehicleDefinition.cpp"
            "Plugins/TorqueVehicleSimulation/Source/TA_Vehicle/Public/TAVehicleDefinition.h"
          )
          if [[ ${#changed[@]} -ne ${#expected[@]} ]]; then
            printf 'REFUSED: unexpected aero closure diff file count: %s\n' "${#changed[@]}" >&2
            printf 'Changed files:\n%s\n' "${changed[*]}" >&2
            exit 1
          fi
          for index in "${!expected[@]}"; do
            if [[ "${changed[$index]}" != "${expected[$index]}" ]]; then
              printf 'REFUSED: unexpected aero closure diff at index %s: %s\n' "$index" "${changed[$index]}" >&2
              exit 1
            fi
          done

      - name: Commit canonical aero ownership closure
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            "Plugins/TorqueVehicleSimulation/Source/TA_Vehicle/Private/TAVehicleDefinition.cpp" \
            "Plugins/TorqueVehicleSimulation/Source/TA_Vehicle/Public/TAVehicleDefinition.h"
          git commit -m "feat(vehicle): close canonical aero asset ownership"
          git push origin HEAD:main
