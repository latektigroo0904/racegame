name: Source sanity

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source-sanity:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate shell verification runner syntax
        run: bash -n Scripts/verify-unreal.sh

      - name: Run Torque Atlas source sanity
        run: python Scripts/source_sanity.py
