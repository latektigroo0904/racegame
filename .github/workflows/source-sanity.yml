name: Source sanity

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source-sanity:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate shell verification runner syntax
        run: bash -n Scripts/verify-unreal.sh

      - name: Validate PowerShell verification runner syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "Scripts/Verify-Unreal.ps1"),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - name: Test Automation report validator
        run: python Scripts/test_validate_automation_report.py

      - name: Test aero asset-closure applicator
        run: python -m unittest tests.tools.test_apply_aero_asset_closure -v

      - name: Test compliant midpoint-fix applicator
        run: python -m unittest tests.tools.test_apply_compliant_midpoint_reaction_fix -v

      - name: Run Torque Atlas source sanity
        run: python Scripts/source_sanity.py

      - name: Exercise compliant midpoint fix against canonical source
        shell: bash
        run: |
          set -euo pipefail
          python scripts/apply_compliant_midpoint_reaction_fix.py
          git diff --check

          mapfile -t changed < <(git diff --name-only)
          expected="Plugins/TorqueVehicleSimulation/Source/TA_Vehicle/Private/TAWheelContactResolver.cpp"
          if [[ ${#changed[@]} -ne 1 || "${changed[0]}" != "$expected" ]]; then
            printf 'Unexpected midpoint-fix diff:\n%s\n' "${changed[*]}" >&2
            exit 1
          fi
          git diff --stat
          git checkout -- "$expected"

      - name: Exercise aero closure against canonical sources
        shell: bash
        run: |
          set -euo pipefail
          python scripts/apply_aero_asset_closure.py
          python scripts/verify_aero_asset_closure.py
          git diff --check

          mapfile -t changed < <(git diff --name-only)
          expected=(
            "Plugins/TorqueVehicleSimulation/Source/TA_Vehicle/Private/TAVehicleDefinition.cpp"
            "Plugins/TorqueVehicleSimulation/Source/TA_Vehicle/Public/TAVehicleDefinition.h"
          )

          if [[ ${#changed[@]} -ne ${#expected[@]} ]]; then
            printf 'Unexpected closure diff file count: %s\n' "${#changed[@]}" >&2
            printf 'Changed files:\n%s\n' "${changed[*]}" >&2
            exit 1
          fi

          for index in "${!expected[@]}"; do
            if [[ "${changed[$index]}" != "${expected[$index]}" ]]; then
              printf 'Unexpected closure diff at index %s: %s\n' \
                "$index" "${changed[$index]}" >&2
              exit 1
            fi
          done

          git diff --stat
