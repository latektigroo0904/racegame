name: Land patch 44

on:
  push:
    paths:
      - ".github/workflows/land-patch44.yml"

permissions:
  contents: write

jobs:
  land-patch44:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Apply fail-closed patch 44 applicator
        shell: bash
        run: |
          set -euo pipefail
          python scripts/apply_compliant_midpoint_reaction_fix.py
          git diff --check

          mapfile -t changed < <(git diff --name-only)
          expected="Plugins/TorqueVehicleSimulation/Source/TA_Vehicle/Private/TAWheelContactResolver.cpp"
          if [[ ${#changed[@]} -ne 1 || "${changed[0]}" != "$expected" ]]; then
            printf 'REFUSED: unexpected patch-44 diff:\n%s\n' "${changed[*]}" >&2
            exit 1
          fi

      - name: Commit canonical fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "Plugins/TorqueVehicleSimulation/Source/TA_Vehicle/Private/TAWheelContactResolver.cpp"
          git commit -m "fix(vehicle): propagate compliant midpoint reaction"
          git push origin HEAD:main
